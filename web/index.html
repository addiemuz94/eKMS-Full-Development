<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180x180.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <script>
      // Apply the persisted/system theme before first paint so there's no flash of the
      // wrong theme. Kept intentionally tiny — mirrors the same 'ekms_web_theme' key and
      // system/light/dark modes ThemeContext.tsx uses once React mounts.
      (function () {
        try {
          var stored = localStorage.getItem('ekms_web_theme')
          var mode = stored === 'light' || stored === 'dark' ? stored : 'system'
          var dark =
            mode === 'dark' ||
            (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
        } catch (e) {
          /* localStorage/matchMedia unavailable — fall back to light, same as no theme set */
        }
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <title>eKMS</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        min-height: 100%;
        font-family: Outfit, 'Segoe UI', Tahoma, sans-serif;
      }
      body {
        background: #f7f9fc;
        color: #152033;
      }
      html[data-theme='dark'] body {
        background: #10151c;
        color: #e2e7ef;
      }
      .boot {
        padding: 48px 24px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot">Loading eKMS…</div>
    </div>
    <noscript>
      <div class="boot">JavaScript is required to use the eKMS portal.</div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
